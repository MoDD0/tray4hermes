name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions pyproject.toml claims support for. If one of them
        # is dropped here, drop the classifier too.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        # PyQt5 links these even under the offscreen platform plugin.
        # The runner image has no desktop stack.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        # Qt runs headless — tests/conftest.py sets QT_QPA_PLATFORM.
        # The README build is covered by tests/test_readme_freshness.py,
        # so a stale generated README fails here too.
        run: python -m pytest

  version:
    name: version does not move backwards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares against origin/main, which needs history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version
        # 2026-07-24 the version went 2.0.11 -> 2.0.6 unnoticed because
        # nothing was checking. This is that check.
        run: python scripts/versioning.py --check-against origin/main
